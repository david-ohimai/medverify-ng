# CI for MedVerify NG, runs on every pull request and on pushes to main.
#
# Cost: private repos get 2,000 free Linux minutes/month on GitHub Free.
# Everything here runs on ubuntu-latest (1× rate; macOS would be 10×), only
# the part of the repo that changed is checked, dependencies are cached, and a
# newer push cancels the run it replaces.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Which parts changed? ─────────────────────────────────────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      server: ${{ steps.filter.outputs.server }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            server:
              - 'server/**'
              - '.github/workflows/ci.yml'
            mobile:
              - 'mobile/**'
              - '.github/workflows/ci.yml'

  # ── Server: typecheck, unit + HTTP tests, build ──────────────────────────
  server:
    name: Server · typecheck, test, build
    needs: changes
    if: needs.changes.outputs.server == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    env:
      # prisma.config.ts needs a URL to load; nothing connects in this job.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Typecheck
        run: npm run typecheck
      - name: Unit + HTTP tests
        run: npm test
      - name: Build
        run: npx tsc -p tsconfig.build.json

  # ── Server: real Postgres + Redis, migrations, end-to-end smoke test ─────
  server-integration:
    name: Server · migrations + smoke test
    needs: server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    # NODE_ENV is NOT set here: with NODE_ENV=production, `npm ci` skips
    # devDependencies (TypeScript, @types, the Prisma CLI). Only the server
    # process itself runs in production mode, see "Build and start".
    env:
      PORT: 3000
      LOG_LEVEL: warn
      DATABASE_URL: postgresql://medverify:medverify@localhost:5433/medverify?schema=public
      REDIS_URL: redis://localhost:6379
      REGULATOR_DEMO_PIN: "246810"
      SWAGGER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      # Every script that loads the server's config (seed, server) validates the
      # whole environment, so the secret must exist before the first of them.
      # Random per run, masked in the logs, never stored anywhere.
      - name: Generate a throwaway token secret for this run
        run: |
          secret="$(openssl rand -base64 48)"
          echo "::add-mask::$secret"
          echo "JWT_ACCESS_SECRET=$secret" >> "$GITHUB_ENV"
      - name: Start PostgreSQL (PostGIS + pgvector) and Redis
        run: docker compose up -d --build --wait
      - name: Install dependencies (including dev tools for the build)
        run: npm ci --include=dev
      - run: npx prisma generate
      - name: Apply migrations to a real database
        run: |
          npx prisma migrate deploy
          npx prisma migrate status
      - name: Seed the registry (validates every CSV row)
        run: npm run seed
      - name: Check the extensions are installed
        run: |
          docker exec medverify-db psql -U medverify -d medverify -tAc \
            "SELECT string_agg(extname, ',' ORDER BY extname) FROM pg_extension" | tee /dev/stderr \
            | grep -q "pg_trgm,plpgsql,postgis,vector"
      - name: Build and start the server
        run: |
          npx tsc -p tsconfig.build.json
          NODE_ENV=production node dist/server.js > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/health/ready > /dev/null && exit 0
            sleep 1
          done
          echo "Server did not become ready"; cat server.log; exit 1
      - name: Smoke test the device flow
        run: bash scripts/smoke-test.sh
      - name: Server log
        if: always()
        run: cat server.log || true
      - name: Stop containers
        if: always()
        run: docker compose down -v

  # ── Mobile: format, analyze, test ───────────────────────────────────────
  mobile:
    name: Mobile · format, analyze, test
    needs: changes
    if: needs.changes.outputs.mobile == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - name: Fetch the Satoshi font (licence forbids committing it)
        run: bash ../.github/scripts/fetch-satoshi.sh assets/fonts
      - name: Local API config from the committed example
        run: cp env/dev.example.json env/dev.json
      - run: flutter pub get
      - name: Formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze (infos count as failures)
        run: flutter analyze --fatal-infos
      - name: Tests
        run: flutter test

  # ── Mobile: Android build (pull requests into main, and manual runs) ─────
  mobile-build:
    name: Mobile · Android APK
    needs: mobile
    if: (github.event_name == 'pull_request' && github.base_ref == 'main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: bash ../.github/scripts/fetch-satoshi.sh assets/fonts
      - run: cp env/prod.example.json env/prod.json
      - run: flutter pub get
      - name: Build release APK (arm64, obfuscated)
        run: >
          flutter build apk --release --target-platform android-arm64
          --obfuscate --split-debug-info=build/symbols
          --dart-define-from-file=env/prod.json
      - uses: actions/upload-artifact@v7
        with:
          name: medverify-apk-${{ github.sha }}
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 5
